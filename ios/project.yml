# XcodeGen source of truth. The .xcodeproj is generated — never edit or commit it.
#   cd ios && xcodegen generate && open Oronzo.xcodeproj

name: Oronzo

options:
  bundleIdPrefix: com.lerio
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"

# Everything account-specific — the signing team and the Supabase project — lives in
# ios/Local.xcconfig, which is gitignored, so this repository can be public without
# publishing anyone's identifiers. Copy the example to create it:
#   cp ios/Local.xcconfig.example ios/Local.xcconfig
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# Shared logic lives in a local SwiftPM package rather than a folder of shared sources,
# so that it can be unit-tested on macOS with `swift test` — no simulator, no signing.
packages:
  OronzoCore:
    path: OronzoCore
  # Auth + PostgREST + token refresh. Only the iOS app talks to the backend — the Watch
  # gets everything from the phone over WatchConnectivity, so it stays dependency-free.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.2

targets:
  Oronzo:
    type: application
    platform: iOS
    sources:
      - path: Oronzo
        # The entitlements file is referenced by the build setting below, never by a build phase.
        # Without this XcodeGen treats it as a resource and copies it into the bundle, which ships
        # a description of the app's capabilities to anyone who downloads it for no reason.
        excludes:
          - "Oronzo.entitlements"
      # One copy of the SwiftUI token mapping, compiled into every surface — see the file's
      # header. It cannot live in OronzoCore, which has no SwiftUI dependency on purpose.
      - path: Shared
    dependencies:
      - package: OronzoCore
        product: OronzoCore
      - package: Supabase
        product: Supabase
      # Embeds the watch app at <Oronzo.app>/Watch/OronzoWatch.app — where watchOS expects it.
      # Verified in M0 by inspecting the built bundle, not by trusting the YAML.
      - target: OronzoWatch
        embed: true
        copy:
          destination: wrapper
          subpath: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lerio.oronzo
        PRODUCT_NAME: Oronzo
        INFOPLIST_FILE: Oronzo/Info.plist
        # HealthKit, so a finished workout can be written to Apple Health. The Watch target has
        # none: the phone owns the session and the phone is what records it.
        CODE_SIGN_ENTITLEMENTS: Oronzo/Oronzo.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  OronzoWatch:
    type: application
    platform: watchOS
    sources:
      - path: OronzoWatch
      - path: Shared
    dependencies:
      - package: OronzoCore
        product: OronzoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lerio.oronzo.watchkitapp
        PRODUCT_NAME: OronzoWatch
        INFOPLIST_FILE: OronzoWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  Oronzo:
    build:
      targets:
        Oronzo: all
    run:
      config: Debug
    archive:
      config: Release
  OronzoWatch:
    build:
      targets:
        OronzoWatch: all
    run:
      config: Debug
